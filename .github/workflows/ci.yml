name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with Ruff
      run: ruff check .

    - name: Type check with mypy
      run: mypy core cli api

    # Tests run against a fake registry: no Internet access is needed.
    - name: Test with pytest
      run: pytest tests/ -q

  # Verifies that a *clean* install exposes everything the code imports
  # (this is what was broken when js_parser's grammars were not declared).
  clean-install:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install the package only (no dev extras)
      run: pip install .
    - name: Import and run from the installed package
      run: |
        cd "$RUNNER_TEMP"
        python -c "import core.pipeline, cli.analyzer; print('import ok')"
        echo 'import os' > sample.py
        halluguard --offline sample.py
